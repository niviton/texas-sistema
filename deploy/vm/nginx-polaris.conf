# Nginx do Polaris: HTTPS na porta 8443 e, na 8000, só redireciona para o HTTPS.

server {
    listen 8000 default_server;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl default_server;
    server_name _;

    ssl_certificate     /opt/polaris/ssl/polaris.crt;
    ssl_certificate_key /opt/polaris/ssl/polaris.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Fotos do celular (até 12 por registro) e PDFs
    client_max_body_size 60M;

    location /static/ {
        alias /opt/polaris/app/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /opt/polaris/dados/media/;
    }

    location / {
        proxy_pass http://unix:/run/polaris/gunicorn.sock;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
