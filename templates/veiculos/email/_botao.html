{# Botão que funciona em qualquer leitor de e-mail (Gmail, Outlook, celular). Recebe url e texto. #}
<table role="presentation" cellpadding="0" cellspacing="0"><tr>
  <td align="center" bgcolor="#f5a623" style="border-radius:10px; background:#f5a623;">
    <a href="{{ url }}" style="display:inline-block; padding:13px 26px; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:14.5px; font-weight:bold; color:#0d1b2e; text-decoration:none; border-radius:10px;">{{ texto }}</a>
  </td>
</tr></table>
