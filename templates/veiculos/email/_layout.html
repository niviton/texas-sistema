<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="utf-8"></head>
<body style="margin:0; padding:0; background:#f4f6f8; font-family:Arial, Helvetica, sans-serif; color:#12181f;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8; padding:24px 0;">
  <tr><td align="center">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background:#ffffff; border-radius:12px; overflow:hidden; border:1px solid #e6e9ec;">
      <tr><td style="background:#0d2440; padding:18px 24px; color:#ffffff;">
        <div style="font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#f5a623; font-weight:bold;">Polaris · Frota</div>
        <div style="font-size:19px; font-weight:bold; margin-top:4px;">{% block header %}{% endblock %}</div>
      </td></tr>
      <tr><td style="padding:22px 24px; font-size:14px; line-height:1.5;">
        {% block body %}{% endblock %}
      </td></tr>
      <tr><td style="padding:14px 24px; background:#f7f8fa; font-size:11.5px; color:#8b95a1;">
        Mensagem automática do sistema Polaris · Texas Controls. Não responda este e-mail.
      </td></tr>
    </table>
  </td></tr>
</table>
</body></html>
